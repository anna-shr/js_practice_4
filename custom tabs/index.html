<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кастомные табы</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="tabs-container">
        <div class="tabs-nav" id="tabsNav">
            <button class="tab-btn active" data-tab="tab1">
                <span class="tab-label">Tab1</span>
            </button>
            <button class="tab-btn" data-tab="tab2">
                <span class="tab-label">Tab2</span>
            </button>
            <button class="tab-btn" data-tab="tab3">
                <span class="tab-label">Tab3</span>
            </button>
            <button class="tab-btn" data-tab="tab4">
                <span class="tab-label">Tab4</span>
            </button>
            <button class="tab-btn" data-tab="tab5">
                <span class="tab-label">Tab5</span>
            </button>
            <button class="tab-btn" data-tab="tab6">
                <span class="tab-label">Tab6</span>
            </button>
            <button class="tab-btn" data-tab="tab7">
                <span class="tab-label">Tab7</span>
            </button>
        </div>

        <div class="tabs-content">
            <div class="tab-panel active" id="tab1">
                <h2>Контент Tab1</h2>
                <p>Содержимое первого таба.</p>
            </div>
            <div class="tab-panel" id="tab2">
                <h2>Контент Tab2</h2>
                <p>Содержимое второго таба.</p>
            </div>
            <div class="tab-panel" id="tab3">
                <h2>Контент Tab3</h2>
                <p>Содержимое третьего таба.</p>
            </div>
            <div class="tab-panel" id="tab4">
                <h2>Контент Tab4</h2>
                <p>Содержимое четвертого таба.</p>
            </div>
            <div class="tab-panel" id="tab5">
                <h2>Контент Tab5</h2>
                <p>Содержимое пятого таба.</p>
            </div>
            <div class="tab-panel" id="tab6">
                <h2>Контент TAB6</h2>
                <p>Содержимое шестого таба.</p>
            </div>
            <div class="tab-panel" id="tab7">
                <h2>Контент Tab7</h2>
                <p>Содержимое седьмого таба.</p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
